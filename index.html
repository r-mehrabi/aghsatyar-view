function lReceiptDoc(w){

// تطبیق دریافت‌های قراردادها با اسناد دفتر؛ منبع حقیقت: دریافت‌های قرارداد
function lSyncPlan(L,payments,noOf){
  const op=lOpeningDoc(L);
  const credit=L.settings.receiptCredit||'1302';
  const want={};let skipped=0;
  if(op)for(const p of payments){
    if(p.deletedAt!=null||!p.dest||!lReceiptDests().includes(p.dest))continue;
    if(p.date<op.date){skipped++;continue;}
    want[p.id]={pay:p.id,amount:p.amount,date:p.date,dest:p.dest,credit,no:noOf(p)};
  }
  const have={};
  for(const d of L.docs)if(d.type==='receipt'&&d.status==='posted'&&!d.reversedBy&&d.meta&&d.meta.pay)have[d.meta.pay]=d;
  const acts=[];
  for(const id in want){
    const w=want[id],d=have[id];
    if(!d)acts.push({kind:'create',w});
    else{
      const dr=d.lines.find(l=>l.dr>0),cr=d.lines.find(l=>l.cr>0);
      if(d.date!==w.date||dr.a!==w.dest||cr.a!==w.credit||dr.dr!==w.amount||d.meta.no!==w.no)acts.push({kind:'fix',w,doc:d});
    }
  }
  for(const id in have)if(!want[id])acts.push({kind:'reverse',doc:have[id]});
  return {acts,skipped,hasOpening:!!op};
}
function lSyncApply(L,plan,kinds){

    else if(a.kind==='fix'){const nd=lReceiptDoc(a.w);lCorrect(L,a.doc.id,{type:'receipt',...nd},'اصلاح دریافت قسط',nd.date<a.doc.date?a.doc.date:nd.date);}
    else{const t=today();lReverse(L,a.doc.id,'حذف یا تغییر دریافت قسط',t<a.doc.date?a.doc.date:t);}
  }
}

function lAddDay(iso){const p=iso.split('-').map(Number);const d=new Date(Date.UTC(p[0],p[1]-1,p[2]+1));return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
const lLastClosing=L=>lPosted(L).filter(d=>d.type==='closing'&&!d.reversedBy).sort((a,b)=>a.meta.to<b.meta.to?1:-1)[0]||null;
function lPLRows(L,from,to){
  const B={};
  for(const d of L.docs){
    if(d.status!=='posted'||(from&&d.date<from)||(to&&d.date>to))continue;
    for(const l of d.lines){const a=L_ACC[l.a];if(!(a.type==='rev'||a.type==='contra'||a.type==='exp'))continue;const b=B[l.a]||(B[l.a]={dr:0,cr:0});b.dr+=l.dr;b.cr+=l.cr;}
  }

}
function lPLSummary(L,from,to){
  const B=lPLRows(L,from,to);const net=c=>{const b=B[c];return b?b.cr-b.dr:0;};
  const sales=net('4101')+net('4201'),cogs=-net('5101'),contract=net('4102'),opex=-net('6101'),fees=-net('6102');
  return {sales,cogs,gross:sales-cogs,contract,opex,fees,net:sales-cogs+contract-opex-fees,rows:B};

function lPLByPartner(L,from,to){
  const out={};L.partners.forEach(p=>{out[p.id]=0;});
  for(const d of L.docs){
    if(d.status!=='posted'||(from&&d.date<from)||(to&&d.date>to))continue;
    let n=0;for(const l of d.lines){const a=L_ACC[l.a];if(a.type==='rev'||a.type==='contra'||a.type==='exp')n+=l.cr-l.dr;}
    if(!n)continue;
    const al=lAllocate(L,n,d.date);for(const id in al)out[id]+=al[id];
  }
  return out;
}
function lCloseBuild(L,to,retain){
  retain=Number(retain)||0;
  if(!lIsoOk(to))throw Error('تاریخ پایان دوره معتبر نیست.');
  if(!lOpeningDoc(L))throw Error('ابتدا سند افتتاحیه را ثبت کنید.');
  if(to>today())throw Error('تاریخ پایان دوره نمی‌تواند در آینده باشد.');
  const last=lLastClosing(L);
  if(last&&to<=last.meta.to)throw Error('دورهٔ قبلی تا '+last.meta.to+' بسته شده؛ تاریخ بعدتری بزنید.');
  if(L.docs.some(d=>d.status==='draft'&&d.date<=to))throw Error('پیش‌نویس‌هایی تا این تاریخ هست؛ آن‌ها را ثبت یا حذف کنید.');
  const B=lBalances(L,to).acc;const lines=[];let profit=0;
  for(const a of lPLAccs()){
    const b=B[a.code];const x=b?b.dr-b.cr:0;if(!x)continue;
    lines.push(x>0?{a:a.code,dr:0,cr:x,p:null,m:''}:{a:a.code,dr:-x,cr:0,p:null,m:''});
    profit-=x;
  }
  if(!lines.length)throw Error('سود و زیانی برای تقسیم وجود ندارد.');
  const fromD=last?lAddDay(last.meta.to):'';
  let al=lPLByPartner(L,fromD,to);
  if(Object.values(al).reduce((s,x)=>s+x,0)!==profit)al=lAllocate(L,profit,to);
  if(!Number.isSafeInteger(retain)||retain<0)throw Error('مبلغ سود تقسیم‌نشده معتبر نیست.');
  if(retain>0&&(profit<=0||retain>profit))throw Error('سود تقسیم‌نشده باید از صفر تا کل سود دوره باشد.');
  const ra=retain>0?lAllocate(L,retain,to):{};
  for(const p of L.partners){const v=(al[p.id]||0)-(ra[p.id]||0);if(v>0)lines.push({a:p.acc,dr:0,cr:v,p:null,m:''});else if(v<0)lines.push({a:p.acc,dr:-v,cr:0,p:null,m:''});}
  if(retain>0)lines.push({a:'3201',dr:0,cr:retain,p:null,m:''});
  const meta={to,profit,alloc:al};if(retain>0){meta.retain=retain;meta.retainAlloc=ra;}
  return {lines,profit,alloc:al,retain,retainAlloc:ra,meta};
}
function lClosePeriod(L,to,retain){
  const b=lCloseBuild(L,to,retain);
  const d=lNewDraft(L,'closing',{date:to,desc:'تقسیم سود و بستن دوره تا '+to,lines:b.lines,meta:b.meta});
  lPost(L,d.id);
  L.settings.lockDate=to;
  return b;
}
// سود تقسیم‌نشدهٔ هر شریک = جمع سهم نگه‌داشته‌شده در بستن دوره‌ها − آزادسازی‌ها
L_DOC_TYPES.release='آزادسازی سود تقسیم‌نشده';
function lRetained(L,excludeId){
  const out={};L.partners.forEach(p=>{out[p.id]=0;});
  for(const d of lPosted(L)){
    if(d.reversedBy||d.id===excludeId||!d.meta)continue;
    if(d.type==='closing'&&d.meta.retainAlloc)for(const id in d.meta.retainAlloc)out[id]=(out[id]||0)+d.meta.retainAlloc[id];
    if(d.type==='release'&&d.meta.alloc)for(const id in d.meta.alloc)out[id]=(out[id]||0)-d.meta.alloc[id];
  }
  return out;
}
function lReleaseRetained(L,date,amounts){
  const av=lRetained(L);const lines=[];let tot=0;const alloc={};
  if(!lIsoOk(date))throw Error('تاریخ معتبر نیست.');
  if(date>today())throw Error('تاریخ نمی‌تواند در آینده باشد.');
  for(const p of L.partners){
    const v=Number(amounts[p.id])||0;if(!v)continue;
    if(!Number.isSafeInteger(v)||v<0)throw Error('مبلغ نامعتبر است.');
    if(v>(av[p.id]||0))throw Error('سود تقسیم‌نشدهٔ '+p.name+' فقط '+(av[p.id]||0)+' تومان است.');
    alloc[p.id]=v;tot+=v;lines.push({a:p.acc,dr:0,cr:v,p:null,m:''});
  }
  if(!tot)throw Error('مبلغی وارد نشده است.');
  lines.unshift({a:'3201',dr:tot,cr:0,p:null,m:''});
  const d=lNewDraft(L,'release',{date,desc:'آزادسازی سود تقسیم‌نشده به جاری شرکا',lines,meta:{alloc}});
  lPost(L,d.id);return d;
}
function lStatement(L,partnerId,from,to){
  const p=L.partners.find(x=>x.id===partnerId);if(!p)throw Error('شریک پیدا نشد.');
  const rows=lTurnover(L,p.acc);
  let open=0;const out=[];
  for(const r of rows){
    if(from&&r.doc.date<from){open=r.bal;continue;}
    if(to&&r.doc.date>to)continue;
    out.push(r);
  }
  const close=out.length?out[out.length-1].bal:open;
  return {partner:p,open,rows:out,close};
}

function lDaysBetween(a,b){const p=a.split('-').map(Number),q=b.split('-').map(Number);return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5);}
function lInventoryAging(L,t){
  const B=[{k:'0-30',max:30,n:0,cost:0},{k:'31-60',max:60,n:0,cost:0},{k:'61-90',max:90,n:0,cost:0},{k:'بیش از ۹۰',max:1e9,n:0,cost:0}];
  const list=[];
  for(const p of lPhones(L)){
    if(p.status!=='stock')continue;
    const d=lDocById(L,p.src);const age=Math.max(0,lDaysBetween(d.date,t));
    list.push({...p,age});const b=B.find(x=>age<=x.max);b.n++;b.cost+=p.cost;
  }
  list.sort((a,b)=>b.age-a.age);
  return {buckets:B,list};
}
function lPartyBalances(L){
  const out=[];
  for(const p of L.parties){const t=lPartyTotals(L,p.id);if(t.receivable||t.payable)out.push({party:p,...t});}
  return out;
}
const lB64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s);};
const lUnB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function lDeriveKey(pw,salt,iter,usage){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[usage]);
}
async function lEncrypt(text,pw){
  if(!(globalThis.crypto&&crypto.subtle))throw Error('رمزنگاری در این دستگاه پشتیبانی نمی‌شود.');
  if(typeof pw!=='string'||pw.length<8)throw Error('رمز باید دست‌کم ۸ نویسه باشد.');
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iter=200000;
  const key=await lDeriveKey(pw,salt,iter,'encrypt');
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return {kind:'ledger-backup-enc',version:1,iter,salt:lB64(salt),iv:lB64(iv),data:lB64(ct)};
}
async function lDecrypt(obj,pw){
  if(!obj||obj.kind!=='ledger-backup-enc'||obj.version!==1||!Number.isInteger(obj.iter)||obj.iter<1000||obj.iter>2e6)throw Error('فایل پشتیبان رمزنگاری‌شده معتبر نیست.');
  try{
    const key=await lDeriveKey(pw,lUnB64(obj.salt),obj.iter,'decrypt');
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:lUnB64(obj.iv)},key,lUnB64(obj.data));
    return new TextDecoder().decode(pt);
  }catch(e){throw Error('رمز اشتباه است یا فایل خراب شده است.');}
}

function lAccNameCheck(L,name,exceptCode){
  name=String(name||'').trim();
  if(!name||name.length>60)throw Error('نام حساب را درست وارد کنید (حداکثر ۶۰ نویسه).');
  for(const a of L_ACCOUNTS){if(a.code!==exceptCode&&lAccName(L,a.code)===name)throw Error('حسابی با همین نام هست.');}
  return name;
}
function lAddBank(L,name){
  name=lAccNameCheck(L,name,null);
  L.bankAccounts=L.bankAccounts||[];
  const used=new Set(L.bankAccounts.map(c=>c.code));
  let n=1110;while(used.has(String(n)))n++;
  if(n>1199)throw Error('تعداد حساب‌های بانکی به حداکثر رسیده است.');
  L.bankAccounts.push({code:String(n),name});
  lApplyAccounts(L);return String(n);
}
function lRenameBank(L,code,name){
  const a=L_ACC[code];if(!a||!a.bank)throw Error('این حساب بانکی نیست.');
  name=lAccNameCheck(L,name,code);
  L.accNames=L.accNames||{};L.accNames[code]=name;lApplyAccounts(L);
}
function lToggleBank(L,code){
  const a=L_ACC[code];if(!a||!a.bank)throw Error('این حساب بانکی نیست.');
  L.accOff=L.accOff||{};
  if(L.accOff[code])delete L.accOff[code];
  else{
    const b=lBalances(L).acc[code];
    if(b&&b.dr!==b.cr)throw Error('مانده این حساب صفر نیست؛ ابتدا موجودی‌اش را منتقل کنید.');
    if(L.docs.some(d=>d.status==='draft'&&d.lines.some(l=>l.a===code)))throw Error('پیش‌نویسی با این حساب هست.');
    L.accOff[code]=true;
  }
  lApplyAccounts(L);
}
function lDeleteBank(L,code){
  const a=L_ACC[code];if(!a||!a.custom)throw Error('فقط حساب‌های افزوده‌شده حذف می‌شوند؛ حساب‌های اصلی را می‌توان غیرفعال کرد.');
  if(L.docs.some(d=>d.lines.some(l=>l.a===code)))throw Error('این حساب سند دارد و حذف نمی‌شود؛ آن را غیرفعال کنید.');
  L.bankAccounts=L.bankAccounts.filter(c=>c.code!==code);
  if(L.accNames)delete L.accNames[code];
  if(L.accOff)delete L.accOff[code];
  lApplyAccounts(L);
}

function lgGuardAmt(d){return d.type==='sale'&&d.meta&&d.meta.price?d.meta.price:lgDocAmount(d);}
function lgGuard(type,date,amt,sig){
  if(!amt||!LG)return true;
  const same=LG.docs.filter(d=>d.status==='posted'&&!d.reversedBy&&d.type===type);
  const dup=same.find(d=>d.date===date&&lgGuardAmt(d)===amt&&(!sig||d.lines.map(l=>l.a).sort().join('|')===sig));
  if(dup&&!confirm(`سند مشابهی قبلاً ثبت شده است:\nسند ${fa(dup.no)} · ${jshow(dup.date)} · ${money(amt)}\n\nمطمئنی دوباره ثبت شود؟`))return false;
  const arr=same.map(lgGuardAmt).sort((a,b)=>a-b);
  const med=arr.length?arr[Math.floor(arr.length/2)]:0;
  if(((arr.length>=3&&med>0&&amt>med*10)||amt>=1e10)&&!confirm(`مبلغ ${money(amt)} خیلی بیشتر از حد معمول است`+(med?` (مبلغ معمول این نوع سند حدود ${money(med)} است)`:'')+`.\nشاید رقم اضافه تایپ شده باشد. مطمئنی ثبت شود؟`))return false;
  return true;
}

function lgBreakdownRows(code,withZero){
  const B=lBalances(LG),rows=[];let tot=0,sumNamed=0;
  for(const p of LG.parties){
    const b=B.party[code+'|'+p.id];if(!b)continue;
    const n=b.dr-b.cr;if(!n&&!withZero)continue;
    rows.push({p,n});sumNamed+=n;
  }
  const a=B.acc[code],all=a?a.dr-a.cr:0;
  const rest=all-sumNamed;
  rows.sort((x,y)=>(!x.n-!y.n)||Math.abs(y.n)-Math.abs(x.n));
  return {rows,rest,all};
}

function lgDocCard(d){
  const dead=!!d.reversedBy,draft=d.status==='draft';
  return `<div class="card dcard ${dead?'dead':''}" onclick="lgDocView('${d.id}')">
  <div class="dno ${draft?'draft':''}">${draft?'پیش‌نویس':fa(d.no)}</div>
  <div class="dbody"><div class="dtitle">${esc(fa(d.desc||L_DOC_TYPES[d.type]))}</div><div class="dmeta">${esc(L_DOC_TYPES[d.type])} · ${jshow(d.date)}${dead?' · برگشت‌خورده':''}</div></div>
  <div class="damt">${nf(lgDocAmount(d))}</div></div>`;
}
function lgFlat(o,out,dep){
  if(o==null||dep>5)return;
  if(typeof o==='string'||typeof o==='number'){out.push(String(o));return;}
  if(Array.isArray(o)){o.forEach(x=>lgFlat(x,out,dep+1));return;}
  if(typeof o==='object')Object.values(o).forEach(x=>lgFlat(x,out,dep+1));
}
function lgDocHay(d){
  const p=[d.desc||'',L_DOC_TYPES[d.type]||'',d.no?String(d.no):'',jshow(d.date),d.date||''];
  const m=lgDocAmount(d);p.push(String(m),nf(m).replace(/[٬,\s]/g,''),nf(m));
  for(const l of d.lines){
    if(l.p){const q=lPartyById(LG,l.p);if(q)p.push(q.name);}
    if(l.m)p.push(l.m);
    p.push(lAccName(LG,l.a));
  }
  lgFlat(d.meta,p,0);
  if(d.type==='sale'&&d.meta&&Array.isArray(d.meta.items)){const all=lPhones(LG);for(const it of d.meta.items){const ph=all.find(x=>x.id===it.phone);if(ph)p.push(lgPhoneLabel(ph),ph.imei1,ph.imei2||'');}}
  return digits(p.join(' ')).toLowerCase();
}
let lgDocSort='date_desc';
const LG_DOC_SORTS=[['date_desc','تاریخ: جدید به قدیم'],['date_asc','تاریخ: قدیم به جدید'],['no_asc','شماره: کم به زیاد'],['no_desc','شماره: زیاد به کم']];
function lgDocSortFn(a,b){
  const [k,dir]=lgDocSort.split('_');const m=dir==='asc'?1:-1;
  if(k==='no'){
    const na=a.no==null?Infinity:a.no,nb=b.no==null?Infinity:b.no;
    return (na-nb)*m||(a.date<b.date?-1:a.date>b.date?1:0);
  }
  return (a.date<b.date?-1:a.date>b.date?1:(a.no||0)-(b.no||0))*m;
}
function lgDocs(){
  let ds=LG.docs.slice().sort((a,b)=>(a.status!==b.status&&lgDocSort.startsWith('date')?(a.status==='draft'?-1:1):0)||lgDocSortFn(a,b));
  const toks=digits(query).trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(toks.length)ds=ds.filter(d=>{const hy=lgDocHay(d);return toks.every(t=>hy.includes(t));});
  return `<div class="row spread mb"><h2>اسناد</h2><div class="row"><button class="secondary" onclick="lgPrintDocs()">PDF</button><button onclick="lgNewDoc()">+ سند جدید</button></div></div>
  <div class="chips mb">${LG_DOC_SORTS.map(([k,v])=>`<button class="chip ${lgDocSort===k?'on':''}" onclick="lgDocSort='${k}';render()">${v}</button>`).join('')}</div>
  ${searchBox('جستجو: نام، شرح، مبلغ، IMEI، شمارهٔ سند…')}
  ${toks.length?`<p class="muted">${fa(ds.length)} سند پیدا شد.</p>`:''}${ds.slice(0,lim()).map(lgDocCard).join('')||empty(toks.length?'سندی با این مشخصات پیدا نشد.':'هنوز سندی ثبت نشده است.')}${moreBtn(ds.length)}`;

  if(d.status==='draft'){
    btn=`<button onclick="lgForm('${d.type}','${d.id}')">ویرایش</button>`;

    btn=`<button onclick="lgForm('opening','${d.id}')">تغییر افتتاحیه (اصلاحی)</button>`;
  }else if(d.type!=='reversal'&&!d.reversedBy){
    btn=`<button onclick="${d.type==='purchase'?`lgPurchaseForm('${d.id}')`:d.type==='sale'?`lgSaleForm('${d.id}')`:`lgForm('${d.type}','${d.id}')`}">اصلاح سند</button><button class="danger" onclick="lgReverseForm('${d.id}')">برگشت سند</button>`;

function lgOpSave(mode,id){
  lgOpSync();
  const type=opType,date=readDateRow('opd');
  const ph=type==='opening'&&opPhones.length;
  const lines=opRows.filter(r=>r.amt>0&&!(ph&&r.a==='1201')).map(r=>({a:r.a,dr:r.side==='D'?r.amt:0,cr:r.side==='C'?r.amt:0,p:r.p||null,m:opType==='opening'?'':String(r.m||'').trim()}));
  if(ph)lines.unshift({a:'1201',dr:lgOpPhSum(),cr:0,p:null,m:''});
  const meta=ph?{phones:opPhones}:null;
  const desc=type==='opening'?'سند افتتاحیه':($('opdesc')?$('opdesc').value:'');
  if(mode==='correct'){
    const reason=$('opr').value;const old=lDocById(LG,id);
    return void changeLedger(()=>{lCorrect(LG,id,{type,date,desc,lines,meta},reason,date<old.date?old.date:date);if(type==='opening')LG.settings.openingDate=date;});
  }
  changeLedger(()=>{
    let d;
    if(id){d=lUpdateDraft(LG,id,{date,desc,lines,meta});}else d=lNewDraft(LG,type,{date,desc,lines,meta});
    if(mode==='post'){lPost(LG,d.id);if(type==='opening')LG.settings.openingDate=date;}
  });
}

  <div id="ph_batw" ${p.cond==='used'?'':'hidden'}>${field('ph_battery','سلامت باتری (٪)',p.battery==null?'':p.battery,'text','inputmode="numeric"')}</div>
  ${field('ph_imei1','IMEI اول (۱۵ رقم، اختیاری)',p.imei1,'text','inputmode="numeric" class="ltr"')}${field('ph_imei2','IMEI دوم (اختیاری)',p.imei2,'text','inputmode="numeric" class="ltr"')}

function lgReadPhone(extra){

    battery:digits($('ph_battery').value),imei1:digits($('ph_imei1').value),imei2:digits($('ph_imei2').value),registry:$('ph_reg').value,warranty:$('ph_war').value,note:$('ph_note').value};
}
const lgImeiTxt=p=>p.imei1?'IMEI '+fa(p.imei1):'بدون IMEI';
function lgPhoneLabel(p){return [p.brand,p.model,p.storage?fa(p.storage)+'GB':'',p.color].filter(Boolean).join(' ');}
let lgPhBrand='',lgPhSort='new';
function lgPhInfo(p){
  const src=lDocById(LG,p.src),sd=p.saleDoc?lDocById(LG,p.saleDoc):null;
  const acq=src?src.date:'',sold=sd?sd.date:'';
  return {src,sd,acq,sold,cust:sd&&sd.meta&&sd.meta.customer?sd.meta.customer:'',
    days:p.status==='stock'&&acq?Math.max(0,Math.floor((Date.parse(today())-Date.parse(acq))/864e5)):0};
}
function lgPhoneHay(p){
  const i=lgPhInfo(p);
  return digits([p.brand,p.model,p.color,p.storage,p.storage?p.storage+'gb':'',p.imei1,p.imei2||'',p.cond==='used'?'کارکرده':'نو',p.warranty||'',p.note||'',
    p.status==='sold'?'فروخته':'موجود',i.cust,i.src&&i.src.no?'سند '+i.src.no:'',i.sd&&i.sd.no?'سند '+i.sd.no:'',i.acq?jshow(i.acq):'',i.sold?jshow(i.sold):''].join(' ')).toLowerCase();
}
function lgPhFilterSet(k){lgPhFilter=k;lgPhBrand='';render();}
let lgPhList=[];

  lgPrint('گزارش موجودی گوشی',sub,table(['ردیف','گوشی','وضعیت فنی','IMEI','وضعیت','ورود / فروش','بها (تومان)'],rows,tot));

function lgPhones(){
  const all=lPhones(LG),inv=lInvCheck(LG),f=lgPhFilter;
  const toks=digits(query).trim().toLowerCase().split(/\s+/).filter(Boolean);
  let base=all.filter(p=>f==='all'||p.status===f);
  if(toks.length)base=base.filter(p=>{const h=lgPhoneHay(p);return toks.every(t=>h.includes(t));});
  const brands={};base.forEach(p=>{const b=(p.brand||'—').trim();brands[b]=(brands[b]||0)+1;});
  if(lgPhBrand&&!brands[lgPhBrand])lgPhBrand='';
  let list=lgPhBrand?base.filter(p=>(p.brand||'—').trim()===lgPhBrand):base.slice();
  const key=p=>{const i=lgPhInfo(p);return lgPhSort==='sold'?(i.sold||''):(i.acq||'');};
  list.sort((a,b)=>lgPhSort==='cost'?b.cost-a.cost:lgPhSort==='old'?(key(a)<key(b)?-1:key(a)>key(b)?1:0):(key(a)<key(b)?1:key(a)>key(b)?-1:0));
  let h=`<div class="row spread mb"><h2>گوشی‌ها</h2><button onclick="lgPurchaseForm('')">+ خرید گوشی</button></div>
  <div class="grid mb"><div class="stat"><span>موجود در انبار</span><b>${fa(inv.count)} عدد</b></div><div class="stat"><span>بهای موجودی گوشی‌ها</span><b>${money(inv.stockCost)}</b></div></div>`;
  if(inv.diff!==0)h+=`<div class="note mb">موجودی کالا در دفتر ${money(inv.ledger)} است ولی جمع بهای گوشی‌های ثبت‌شده ${money(inv.stockCost)} است (اختلاف ${money(Math.abs(inv.diff))}). تا یکی نشود، گزارش موجودی قابل اتکا نیست.</div>`;
  h+=`<div class="chips">${[['stock','موجود'],['sold','فروخته‌شده'],['all','همه']].map(([k,v])=>`<button class="chip ${f===k?'on':''}" onclick="lgPhFilterSet('${k}')">${v}</button>`).join('')}</div>`;
  h+=searchBox('جستجو: برند، مدل، IMEI، خریدار…');
  const bl=Object.entries(brands).sort((a,b)=>b[1]-a[1]);
  if(bl.length>1||lgPhBrand)h+=`<div class="chips" style="margin-top:8px"><button class="chip ${lgPhBrand?'':'on'}" onclick="lgPhBrand='';render()">همه برندها (${fa(base.length)})</button>${bl.map(([b,n])=>`<button class="chip ${lgPhBrand===b?'on':''}" onclick="lgPhBrand=this.dataset.b;render()" data-b="${esc(b)}">${esc(b)} (${fa(n)})</button>`).join('')}</div>`;
  h+=`<div class="chips" style="margin:8px 0">${[['new','جدیدترین'],['old','قدیمی‌ترین'],['cost','گران‌ترین'],...(f!=='stock'?[['sold','تاریخ فروش']]:[])].map(([k,v])=>`<button class="chip ${lgPhSort===k?'on':''}" onclick="lgPhSort='${k}';render()">${v}</button>`).join('')}</div>`;
  lgPhList=list;
  h+=`<p class="muted">${fa(list.length)} گوشی${list.length&&f!=='sold'?' · جمع بها '+money(list.filter(p=>p.status==='stock').reduce((s,p)=>s+p.cost,0)):''}</p>`;
  if(list.length)h+=`<div class="row" style="margin-bottom:8px"><button class="plain" onclick="lgPrintPhones()">خروجی PDF موجودی</button></div>`;
  h+=list.map(p=>{
    const i=lgPhInfo(p),s=p.status==='sold'?lPhoneSale(LG,p.id):null;
    return `<div class="card card-clickable" onclick="lgPhoneView('${p.id}')"><div class="row spread"><strong>${esc(lgPhoneLabel(p))}</strong><span class="badge ${p.status==='sold'?'late':'ok'}">${p.status==='sold'?'فروخته شد':'موجود'}</span></div>
    <div class="muted">${p.cond==='used'?'کارکرده'+(p.battery?' · باتری '+fa(p.battery)+'٪':''):'نو'} · ${esc(lgImeiTxt(p))}</div>${p.note?`<div class="muted">${esc(p.note)}</div>`:''}
    ${p.status==='stock'?`<div class="muted">${i.acq?'وارد شده '+jshow(i.acq)+' · ':''}${fa(i.days)} روز در انبار</div>`:`<div class="muted">${i.cust?'خریدار: '+esc(i.cust)+' · ':''}${i.sold?'فروش '+jshow(i.sold):''}</div>`}
    <div class="link-row"><span>بها: <b>${money(p.cost)}</b>${s?` · سود: <b class="${s.profit<0?'neg':'pos'}">${money(s.profit)}</b>`:''}</span><span class="arrow">›</span></div>
    <div class="row" style="margin-top:6px"><button class="plain" style="padding:5px 10px;min-height:32px;font-size:12px" onclick="event.stopPropagation();lgDocView('${p.src}')">سند ${i.src&&i.src.no?'خرید '+fa(i.src.no):'خرید'}</button>${p.saleDoc?`<button class="plain" style="padding:5px 10px;min-height:32px;font-size:12px" onclick="event.stopPropagation();lgDocView('${p.saleDoc}')">سند فروش ${i.sd&&i.sd.no?fa(i.sd.no):''}</button>`:''}</div></div>`;
  }).join('')||empty(toks.length?'گوشی‌ای با این مشخصات پیدا نشد.':'گوشی‌ای ثبت نشده است.');
  return h;
}

function lgPurchaseSave(){
  lgPySync();

  const phone={...lgReadPhone({id:pyPhoneId||undefined}),price,costs,cost};
  const lines=[{a:'1201',dr:cost,cr:0,p:null,m:''},...pyRows.filter(r=>r.amt>0).map(r=>({a:r.a,dr:0,cr:r.amt,p:r.p||null,m:''}))];
  const desc='خرید '+phone.brand+' '+phone.model;
  const reason=$('pyr')?$('pyr').value:'';
  if(!pyDocId&&!lgGuard('purchase',date,cost))return;
  { const fp=pyRows.find(r=>r.amt>0&&L_ACC[r.a]&&!L_ACC[r.a].party); if(fp&&!pyDocId)lgSetPrefs({pyPay:fp.a}); }
  changeLedger(()=>{
    const ph=lPhoneClean(phone);
    if(pyDocId){const old=lDocById(LG,pyDocId);lCorrect(LG,pyDocId,{type:'purchase',date,desc,lines,meta:{phone:ph}},reason,date<old.date?old.date:date);}
    else{const d=lNewDraft(LG,'purchase',{date,desc,lines,meta:{phone:ph}});lPost(LG,d.id);}
  });
}

function lgExSync(){
  exPays=exPays.map((r,i)=>$('exa'+i)?{a:$('exa'+i).value,p:$('exp'+i)?$('exp'+i).value||null:null,amt:exPays.length===1?0:lgAmt('exm'+i)}:r);

function lgExRender(){
  const one=exPays.length===1;
  $('expay').innerHTML=exPays.map((r,i)=>`<div class="card oprow"><select id="exa${i}" onchange="lgExSync();exPays[${i}].p=null;lgExRender()">${lgPayOpts(r.a)}</select>${L_ACC[r.a]&&L_ACC[r.a].party?lgPartyOpts(r.p,'exp'+i):''}
  ${one?'':`<div class="row" style="margin-top:6px;flex-wrap:nowrap"><div class="grow amount-input"><input id="exm${i}" inputmode="numeric" value="${r.amt?Number(r.amt).toLocaleString('en-US'):''}" placeholder="0" oninput="lgExSum()"><span class="unit">تومان</span></div><button class="danger" style="padding:8px 11px" onclick="lgExSync();exPays.splice(${i},1);lgExRender()">×</button></div>`}</div>`).join('');
  if(!one)exPays.forEach((_,i)=>attachAmountFormatter('exm'+i));

function lgExSum(){
  lgExSync();const el=$('exsum');if(!el)return;
  if(exPays.length===1){el.innerHTML='کل مبلغ از همین حساب پرداخت می‌شود.';return;}
  const tot=lgAmt('exm'),paid=exPays.reduce((s,r)=>s+r.amt,0),d=tot-paid;
  el.innerHTML=`مبلغ هزینه: <b>${nf(tot)}</b> · جمع پرداخت‌ها: <b>${nf(paid)}</b><br>`+(d===0&&tot>0?'<span class="ok">پرداخت‌ها کامل است ✓</span>':`<span class="red">${d>0?'پرداخت‌نشده':'اضافه'}: ${nf(Math.abs(d))}</span>`);
}
function lgExAddPay(){
  lgExSync();
  if(exPays.length===1){exPays[0].amt=lgAmt('exm');}
  const rest=Math.max(lgAmt('exm')-exPays.reduce((s,r)=>s+r.amt,0),0);
  exPays.push({a:lgPrefAcc('exPay'),p:null,amt:rest});lgExRender();
}
function lgExpenseDo(){
  lgExSync();
  const c=$('exc').value,amt=lgAmt('exm'),date=readDateRow('exdt'),desc=$('exs').value;
  const rows=exPays.length===1?[{...exPays[0],amt}]:exPays.filter(r=>r.amt>0);
  const key=[c,...rows.map(r=>r.a)].sort().join('|');
  if(amt){if(!lgGuard('expense',date,amt,key))return;lgSetPrefs({exCat:c,exPay:rows[0]?rows[0].a:'1102'});}
  changeLedger(()=>{
    if(!amt)throw Error('مبلغ را وارد کنید.');
    if(!rows.length)throw Error('مبلغ پرداخت هر حساب را وارد کنید.');
    const paid=rows.reduce((s,r)=>s+r.amt,0);
    if(paid!==amt)throw Error('جمع پرداخت‌ها ('+nf(paid)+') با مبلغ هزینه ('+nf(amt)+') برابر نیست.');
    const d=lNewDraft(LG,'expense',{date,desc:desc||lAccName(LG,c),lines:[{a:c,dr:amt,cr:0},...rows.map(r=>({a:r.a,dr:0,cr:r.amt,p:L_ACC[r.a].party?r.p:null}))]});
    lPost(LG,d.id);
  });
}

  lgOpSync();

  window.__opst=st;

function lgOpPhoneBack(){const s=window.__opst;lgForm('opening',opId,s.rows,'',s.date,true);}
function lgOpPhoneSave(i){
  try{
    const p=lPhoneClean({...lgReadPhone(i>=0?{id:opPhones[i].id}:{}),cost:lgAmt('ph_cost')});
    if(!p.cost)throw Error('بهای گوشی را وارد کنید.');
    if(opPhones.some((q,j)=>j!==i&&((p.imei1&&(q.imei1===p.imei1||q.imei2===p.imei1))||(p.imei2&&(q.imei1===p.imei2||q.imei2===p.imei2)))))throw Error('این IMEI قبلاً در همین افتتاحیه آمده است.');
    if(i>=0)opPhones[i]=p;else opPhones.push(p);
    lgOpPhoneBack();
  }catch(e){alert(e.message);}
}

function lgSlPreview(){
  lgSlSync();
  const el=$('slsum');if(!el)return;
  const tsum=SL.tins.reduce((s,t)=>s+t.cost,0),paid=SL.pays.reduce((s,r)=>s+r.amt,0),side=SL.sides.reduce((s,r)=>s+(Number(r.amt)||0),0);
  const total=lgSlTotal(),F=total-(paid-side)-tsum;
  const R_=(l,v,cls)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:5px 0;font-size:13px"><span>${l}</span><b${cls?` class="${cls}"`:''} style="white-space:nowrap">${v}</b></div>`;
  const pn=v=>`<span class="${v<0?'red':''}">${nf(v)}</span>`;
  let h=R_('قیمت نقدی'+(SL.items.length>1?' (جمع '+fa(SL.items.length)+' گوشی)':''),nf(total))
   +R_('جانبی',side?nf(side):'—')
   +R_('پرداخت‌ها',nf(paid));
  if(tsum)h+=R_('گوشی تعویضی',nf(tsum));
  if(SL.inst){
    h+=R_('مبلغ اقساطی (باقی‌مانده بعد از پرداخت‌ها)',F>0?nf(F):`<span class="red">${nf(F)}</span>`);
  }else{
    const need=total+side-tsum,d=need-paid;
    h+=d===0&&total>0?'<div class="ok" style="margin:5px 0;font-size:13px">پرداخت‌ها برابر قیمت نقدی + جانبی است ✓</div>'
      :`<div class="red" style="margin:5px 0;font-size:13px">پرداخت‌ها باید برابر قیمت نقدی + جانبی${tsum?' − تعویض':''} (${nf(need)}) باشد؛ ${d>0?'دریافت‌نشده':'اضافه'}: ${nf(Math.abs(d))}</div>`;
  }
  try{
    let L2=LG;
    if(SL.doc){L2=JSON.parse(JSON.stringify(LG));const o=lDocById(L2,SL.doc);try{lReverse(L2,SL.doc,'x',SL.date<o.date?o.date:SL.date,true);}catch(e){}}
    const b=lSaleBuild(L2,lgSlInput(),null);
    const c=b.meta.contract;
    h+='<hr style="margin:8px 0">';
    if(c)h+=R_('جمع اقساط (با سود)',nf(c.T))+R_('قیمت خرید قرارداد',nf(c.C));
    h+=R_('سود فروش نقدی گوشی (قیمت نقدی − بها)',pn(total-b.meta.cost));
    if(b.meta.items.length>1)h+=b.meta.items.map(it=>{const ph=L2&&lPhones(L2).find(p=>p.id===it.phone);return `<div class="muted" style="margin:2px 0;font-size:12px">${esc(ph?lgPhoneLabel(ph):'')}: سود ${nf(it.price-it.cost)}</div>`;}).join('');
    if(c)h+=R_('سود نقد کردن قرارداد (قیمت خرید قرارداد − مبلغ اقساطی)',pn(c.C-c.F));
  }catch(e){h+=`<div class="muted" style="margin-top:6px">${esc(e.message)}</div>`;}
  el.innerHTML=h;
}

function lgSlFromInst(){
  lgSlSync();
  const n=SL.months,q=Number(SL.q)||0;
  if(!(n>0)||!(q>0)){alert('تعداد ماه و مبلغ هر قسط را وارد کنید.');return;}
  const ph=SL.items.map(r=>lPhones(LG).find(p=>p.id===r.phone));
  if(!SL.items.length||ph.some(x=>!x)){alert('اول گوشی‌های فروخته‌شده را انتخاب کنید.');return;}
  const paid=SL.pays.reduce((s,r)=>s+r.amt,0),tsum=SL.tins.reduce((s,t)=>s+t.cost,0);
  const T=q*n,F=Math.round(T/(1+n*SL.rs/100));
  const side=SL.sides.reduce((a,r)=>a+(Number(r.amt)||0),0);
  if(side>paid){alert('مبلغ جانبی بیشتر از جمع پرداخت‌هاست.');return;}
  const total=Math.round((F+(paid-side)+tsum)/10000)*10000;
  const useP=SL.items.every(r=>Number(r.price)>0);
  const w=SL.items.map((r,i)=>useP?Number(r.price):ph[i].cost),ws=w.reduce((s,x)=>s+x,0)||1;
  let left=total;
  SL.items=SL.items.map((r,i)=>{
    const last=i===SL.items.length-1;
    const pr=last?left:Math.round(total*w[i]/ws/10000)*10000;
    left-=pr;return {phone:r.phone,price:pr};
  });
  SL.C=Math.round(T/(1+n*SL.rb/100)/1000)*1000;
  lgSaleRender();
}

function lgSaleSave(){

    let old=null;
    if(SL.doc){old=lDocById(LG,SL.doc);lReverse(LG,SL.doc,reason,SL.date<old.date?old.date:SL.date,true);}
    const b=lSaleBuild(LG,lgSlInput(),null);

    const d=lNewDraft(LG,'sale',{date:SL.date,desc:'فروش '+(labs.length>1?fa(labs.length)+' گوشی: ':'')+labs.join('، '),lines:b.lines,meta:b.meta,corrects:old?old.id:null});
    lPost(LG,d.id);
    if(old)old.correctedBy=d.id;
  });
}

function destLabel(c){

  const p=db.payments.find(x=>x.id===payId);

  if(!lgSyncSilentLoad())return 'دفتر شراکت هنوز ساخته نشده است. یک بار وارد «دفتر شراکت» شوید و سند افتتاحیه را ثبت کنید.';

  if(p.date<op.date)return 'تاریخ این دریافت ('+jshow(p.date)+') قبل از تاریخ افتتاحیه دفتر ('+jshow(op.date)+') است؛ در دفتر ثبت نمی‌شود. اگر تاریخ افتتاحیه را عقب بیاورید، ثبت می‌شود.';

  const has=LG.docs.some(d=>d.type==='receipt'&&d.status==='posted'&&!d.reversedBy&&d.meta&&d.meta.pay===payId);

// ===== تسویهٔ زودتر =====
let ES={};
function esDays(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);}
function esCalc(c,st){
  const n=c.count,T=contractTotal(c);
  const left=i=>i.amount-paid(i);
  const unpaid=c.installments.filter(i=>left(i)>0).slice().sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0);
  const late=unpaid.filter(i=>i.due<st.date);
  const elig=unpaid.filter(i=>i.due>=st.date);
  const assumed=c.installments.map(i=>i.due).filter(d=>d>=st.date).sort()[0]||null;
  const sel=st.sel?elig.filter(i=>st.sel.includes(i.id)):elig;
  const R=sel.reduce((s,i)=>s+left(i),0),r=sel.length;
  const d=assumed?Math.max(0,esDays(st.date,assumed)):0;
  const s=(Number(st.rs)||0)/100;
  // بلوک: قسط‌های انتخابی پشت‌سرهم از نزدیک‌ترین قسط پرداخت‌نشده ← فرمول فروش معکوس: مبلغ/(۱+تعداد×نرخ)
  // غیر بلوک (از آخر یا وسط): هر قسط جداگانه به‌اندازهٔ ماه‌های خودش تا سررسید (ماه = ۳۱ روز، به نفع ما)
  const block=sel.length>0&&sel.every((i,k)=>i===elig[k]);
  const t0=st.exact?st.date:(assumed||st.date);
  const mo=i=>Math.max(0,esDays(t0,i.due))/31;
  const reff=block?(st.exact?r+d/30:r):(R>0?sel.reduce((a,i)=>a+left(i)*mo(i),0)/R:0);
  const F=T/(1+n*s),C=T/(1+n*(Number(st.rb)||0)/100);
  const P=F*R/T;
  const raw=R>0?(block?R/(1+reff*s):sel.reduce((a,i)=>a+left(i)/(1+mo(i)*s),0)):0;
  let auto=Math.ceil(raw/10000-1e-9)*10000;auto=Math.min(R,Math.max(auto,Math.ceil(P)));
  const manual=!!st.manual&&Number(st.S)>0;
  const S=R===0?0:(manual?Math.min(R,Math.round(Number(st.S))):auto);
  const wc=T>F?Math.min(1,Math.max(0,(C-F)/(T-F))):0;
  const I=S-P;
  const company=Math.round(I>=0?P+I*wc:S);
  const ruhi=S-company;
  const Dr=Math.round(C*R/T);
  const forgiveC=Math.max(0,Dr-company);
  const discRuhi=(R-Dr)-ruhi;
  return {n,T,F,C,R,r,block,assumed,d,reff,P,raw,auto,S,wc,company,ruhi,Dr,forgiveC,discRuhi,late,elig,sel,left,manual};
}

function esSummary(x){
  const el=$('essum');if(!el)return;
  const R_=(l,v)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:5px 0;font-size:13px"><span>${l}</span><b style="white-space:nowrap">${v}</b></div>`;
  const pct=x.R>0?Math.round((x.R-x.S)/x.R*1000)/10:0;
  let h=R_('تعداد قسط انتخاب‌شده',fa(x.r))+R_('جمع قسط‌های باقی‌مانده',money(x.R))

   +R_('روش محاسبه',x.block?'پشت‌سرهم از نزدیک‌ترین قسط':'هر قسط جدا (بر اساس ماه باقی‌مانده)')
   +R_(x.block?'ماه‌های محاسبه':'میانگین ماه تا سررسید',fa(String(Math.round(x.reff*100)/100)))
   +R_('مبلغ تسویه برای مشتری',money(x.S))
   +R_('تخفیف مشتری',money(x.R-x.S)+' ('+fa(String(pct))+'٪)')+'<hr>'
   +R_('سهم شراکت از مبلغ دریافتی',money(x.company))
   +R_('سهم روحی از مبلغ دریافتی',money(x.ruhi))
   +R_('تخفیف روی شراکت (در دفتر ثبت می‌شود)',money(x.forgiveC))
   +R_('تخفیف روی روحی',money(Math.round(x.discRuhi)));
  if(x.R>0&&x.S<Math.ceil(x.P))h+=`<p class="red" style="margin:8px 0 0">مبلغ از اصل پول باقی‌ماندهٔ این قسط‌ها (${nf(Math.round(x.P))}) کمتر است.</p>`;
  el.innerHTML=h;
}

  ${x.late.length?`<div class="card"><b class="red">قسط‌های معوق (${fa(x.late.length)})</b><div class="muted">این‌ها مشمول تخفیف نیستند و باید با «ثبت دریافت» کامل پرداخت شوند: ${x.late.map(i=>jshow(i.due)+' · '+money(x.left(i))).join('، ')}</div></div>`:''}
  <h3 style="margin-top:12px">قسط‌های قابل تسویه</h3><p class="muted" style="margin:0 0 6px">اگر از نزدیک‌ترین قسط پشت‌سرهم انتخاب کنید، تخفیف بر اساس تعداد قسط است؛ اگر از آخر یا وسط انتخاب کنید، هر قسط جدا بر اساس ماه‌های باقی‌مانده تا سررسیدش.</p>${rows||empty('قسط قابل تسویه‌ای نیست.')}

function esLedgerDoc(sid,amount,date,desc){
  if(!(amount>0))return '';
  if(!lgSyncSilentLoad())return 'دفتر شراکت هنوز ساخته نشده؛ تخفیف شراکت ('+money(amount)+') در دفتر ثبت نشد. با سند دستی «تخفیف و برگشت از فروش» بدهکار و «حساب روحی بابت قراردادها» بستانکار ثبتش کنید.';
  const op=lOpeningDoc(LG);
  if(!op||date<op.date)return 'سند افتتاحیهٔ دفتر ثبت نشده یا تاریخ تسویه قبل از آن است؛ تخفیف شراکت ('+money(amount)+') در دفتر ثبت نشد.';
  const prev=JSON.stringify(LG);
  try{
    const d=lNewDraft(LG,'manual',{date,desc,lines:[{a:'4201',dr:amount,cr:0,m:'تخفیف تسویهٔ زودتر'},{a:'1302',dr:0,cr:amount,m:'تخفیف تسویهٔ زودتر'}],meta:{settle:sid}});
    lPost(LG,d.id);lValidate(LG);
    if(!Native.saveLedger(JSON.stringify(LG)))throw Error('ذخیرهٔ دفتر انجام نشد.');
    return '';
  }catch(e){LG=JSON.parse(prev);return 'تخفیف شراکت ('+money(amount)+') در دفتر ثبت نشد: '+e.message;}
}
function esLedgerCancel(sid){
  if(!lgSyncSilentLoad())return '';
  const d=LG.docs.find(x=>x.type==='manual'&&x.status==='posted'&&!x.reversedBy&&x.meta&&x.meta.settle===sid);
  if(!d)return '';
  const prev=JSON.stringify(LG);
  try{
    const t=today();lReverse(LG,d.id,'لغو تسویهٔ زودتر',t<d.date?d.date:t);
    lValidate(LG);if(!Native.saveLedger(JSON.stringify(LG)))throw Error('ذخیرهٔ دفتر انجام نشد.');
    return '';
  }catch(e){LG=JSON.parse(prev);return 'سند تخفیف شراکت در دفتر برگشت نخورد: '+e.message+' (از «دفتر ← اسناد» خودتان برگشت بزنید).';}
}
function esSave(){
  try{
    esRead();
    const c=contract(ES.cid);
    try{ES.date=readDateRow('esd');}catch(e){throw Error('تاریخ تسویه معتبر نیست.');}
    const x=esCalc(c,ES);
    if(!x.r||x.R<=0)throw Error('حداقل یک قسط را برای تسویه انتخاب کنید.');
    if(ES.date>today())throw Error('تاریخ تسویه نمی‌تواند در آینده باشد.');
    if(ES.date<c.createdAt)throw Error('تاریخ تسویه نمی‌تواند پیش از تاریخ قرارداد باشد.');
    if(!(x.S>=1)||x.S>x.R)throw Error('مبلغ دریافتی معتبر نیست.');
    const u=customer(c.customerId);
    if(!confirm(`تسویهٔ زودتر ثبت شود؟\n\nمشتری: ${u.name}\nقرارداد: ${fa(c.number||'—')}\nتعداد قسط: ${fa(x.r)} · جمع باقی‌مانده: ${money(x.R)}\nمبلغ دریافتی: ${money(x.S)}\nتخفیف مشتری: ${money(x.R-x.S)}\nسهم شراکت: ${money(x.company)} · سهم روحی: ${money(x.ruhi)}\nتخفیف روی شراکت: ${money(x.forgiveC)}\n\nادامه می‌دهید؟`))return;
    const sid=uid(),list=[];let cash=x.S;
    for(const i of x.sel){
      const l=x.left(i),cp=Math.min(l,cash),dp=l-cp;cash-=cp;
      if(cp>0)list.push({id:uid(),contractId:c.id,installmentId:i.id,amount:cp,date:ES.date,note:'تسویهٔ زودتر',dest:ES.dest,deletedAt:null,settleId:sid,kind:'cash'});
      if(dp>0)list.push({id:uid(),contractId:c.id,installmentId:i.id,amount:dp,date:ES.date,note:'تخفیف تسویهٔ زودتر',dest:'',deletedAt:null,settleId:sid,kind:'disc'});
    }
    const dest=ES.dest,date=ES.date,forgive=x.forgiveC,no=c.number||'—',nm=u.name;
    const ok=change(()=>{
      lastDest=dest;if(dest)db.settings.lastDest=dest;
      list.forEach(p=>db.payments.push(p));
    });
    if(ok){
      const msgs=[];
      const m1=lgPayStatusMsg(dest,date);if(m1)msgs.push(m1);
      const m2=esLedgerDoc(sid,forgive,date,'تخفیف تسویهٔ زودتر · قرارداد '+no+' · '+nm);if(m2)msgs.push(m2);
      if(msgs.length)setTimeout(()=>alert(msgs.join('\n\n')),500);else showToast('تسویهٔ زودتر ثبت شد ✅');
    }
  }catch(e){alert(e.message);}
}
function lgSettleCancel(sid){
  const ps=db.payments.filter(p=>p.settleId===sid&&isLive(p));
  if(!ps.length)return;
  const cash=ps.filter(p=>p.kind==='cash').reduce((s,p)=>s+p.amount,0),disc=ps.filter(p=>p.kind==='disc').reduce((s,p)=>s+p.amount,0);
  if(!confirm(`کل این تسویهٔ زودتر لغو شود؟\n\nدریافت ثبت‌شده: ${money(cash)}\nتخفیف: ${money(disc)}\nقسط‌ها دوباره پرداخت‌نشده می‌شوند.`))return;
  const ok=change(()=>{const t=Date.now();db.payments.forEach(p=>{if(p.settleId===sid&&isLive(p))p.deletedAt=t;});});
  if(ok){const m=esLedgerCancel(sid);if(m)setTimeout(()=>alert(m),400);else showToast('تسویه لغو شد');}
}
// ===== همگام‌سازی نمایشی آنلاین (GitHub) =====
const SYN={err:'',at:0,busy:false,timer:null,last:0};
const synCfg=()=>((db&&db.settings&&db.settings.sync)||{});
const synOn=()=>{const c=synCfg();return !window.VIEWER&&!!(c.on&&c.repo&&c.token&&c.pass);};
async function synApi(c,method,path,body){
  const r=await fetch('https://api.github.com/repos/'+c.repo+path,{method,headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e;}
  return j;
}
function synErrText(e){
  const s=e&&e.status;
  if(s===401)return 'توکن نامعتبر یا منقضی است.';
  if(s===403)return 'توکن اجازهٔ نوشتن در این مخزن را ندارد (یا محدودیت تعداد درخواست).';
  if(s===404)return 'مخزن یا شاخه پیدا نشد؛ نام مخزن و دسترسی توکن را بررسی کنید.';
  if(s===409)return 'مخزن خالی است؛ هنگام ساخت مخزن در GitHub گزینهٔ README را بزنید.';
  if(!s)return 'اتصال به GitHub برقرار نشد (اینترنت یا فیلتر).';
  return (e&&e.message)||'خطای ناشناخته';
}
async function synPush(manual){
  if(!synOn()){if(manual)alert('همگام‌سازی روشن نیست.');return;}
  if(SYN.busy)return;
  SYN.busy=true;SYN.err='';
  try{
    const c=synCfg();
    lgSyncSilentLoad();
    const d=JSON.parse(JSON.stringify(db));if(d.settings)delete d.settings.sync;
    const env=await lEncrypt(JSON.stringify({kind:'aghsatyar-snapshot',v:1,at:new Date().toISOString(),data:d,ledger:LG||null}),c.pass);
    const blob=await synApi(c,'POST','/git/blobs',{content:btoa(JSON.stringify(env)),encoding:'base64'});
    const tree=await synApi(c,'POST','/git/trees',{tree:[{path:'snapshot.json',mode:'100644',type:'blob',sha:blob.sha}]});
    const com=await synApi(c,'POST','/git/commits',{message:'snapshot',tree:tree.sha,parents:[]});
    const br=c.branch||'main';
    try{await synApi(c,'PATCH','/git/refs/heads/'+br,{sha:com.sha,force:true});}
    catch(e){if(e.status===404||e.status===422)await synApi(c,'POST','/git/refs',{ref:'refs/heads/'+br,sha:com.sha});else throw e;}
    SYN.at=Date.now();SYN.last=Date.now();
    if(manual)showToast('ارسال شد ✅');
  }catch(e){SYN.err=synErrText(e);if(manual)alert(SYN.err);}
  finally{SYN.busy=false;synRefreshCard();}
}
function synPushSoon(){
  if(!synOn())return;
  clearTimeout(SYN.timer);
  SYN.timer=setTimeout(()=>synPush(false),Math.max(20000,SYN.last+90000-Date.now()));
}
function synStatusText(){
  if(!synOn())return 'خاموش است.';
  if(SYN.err)return 'خطا: '+SYN.err;
  if(SYN.busy)return 'در حال ارسال…';
  if(SYN.at){const d=new Date(SYN.at);return 'آخرین ارسال موفق: '+jshow(today())+' ساعت '+fa(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));}
  return 'روشن است؛ ارسال بعد از اولین تغییر یا با «ارسال همین حالا» انجام می‌شود.';
}
function synCard(){
  return `<div class="card"><b>نسخهٔ نمایشی آنلاین (GitHub)</b><p class="muted" id="synst">${esc(synStatusText())}</p><p class="muted">یک کپی رمزنگاری‌شده از اطلاعات بعد از هر تغییر در GitHub ذخیره می‌شود تا شرکا در نسخهٔ وب فقط‌خواندنی ببینند.</p>
  <div class="row"><button onclick="synForm()">تنظیمات</button>${synOn()?'<button class="secondary" onclick="synPush(true)">ارسال همین حالا</button>':''}</div></div>`;
}
function synRefreshCard(){const e=$('synst');if(e)e.textContent=synStatusText();}
function synForm(){
  const c=synCfg();
  modal('نسخهٔ نمایشی آنلاین',`<p class="note">یک مخزن خصوصی جدید در GitHub بسازید (با گزینهٔ README) و یک توکن دقیق (Fine-grained) فقط برای همان مخزن با دسترسی «Contents: Read and write» بسازید. رمز را به شرکا بدهید؛ بدون آن داده خوانده نمی‌شود.</p>
  ${field('synrepo','مخزن داده (نام‌کاربری/نام‌مخزن)',c.repo||'','text','dir="ltr" autocapitalize="off" autocomplete="off"')}
  <label for="syntok">توکن GitHub</label><input id="syntok" type="password" dir="ltr" autocomplete="off" value="${esc(c.token||'')}">
  <label for="synpass">رمز رمزنگاری (دست‌کم ۸ نویسه)</label><input id="synpass" type="password" autocomplete="off" value="${esc(c.pass||'')}">
  ${field('synbr','شاخه',c.branch||'main','text','dir="ltr" autocapitalize="off"')}
  <div class="actions row"><button onclick="synSave()">ذخیره و ارسال</button>${c.on?'<button class="danger" onclick="synOff()">خاموش کردن</button>':''}<button class="plain" onclick="closeModal()">انصراف</button></div>`);
}
function synSave(){
  try{
    const repo=val('synrepo'),token=val('syntok'),pass=$('synpass').value,branch=val('synbr')||'main';
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw Error('نام مخزن را به شکل «نام‌کاربری/نام‌مخزن» بنویسید.');
    if(!token)throw Error('توکن را وارد کنید.');
    if(pass.length<8)throw Error('رمز دست‌کم ۸ نویسه باشد.');
    if(!/^[\w./-]+$/.test(branch))throw Error('نام شاخه معتبر نیست.');
    if(change(()=>{db.settings.sync={on:true,repo,token,pass,branch};}))setTimeout(()=>synPush(true),50);
  }catch(e){alert(e.message);}
}
function synOff(){
  if(!confirm('همگام‌سازی خاموش شود؟ کپی قبلی در GitHub می‌ماند.'))return;
  change(()=>{if(db.settings.sync)db.settings.sync.on=false;});
}
setTimeout(()=>{if(typeof db!=='undefined'&&db&&synOn())synPushSoon();},4000);
/*== LEDGER-UI:END ==*/

  <div class="row">

<script>(function(){
'use strict';
window.VIEWER=true;
const $=id=>document.getElementById(id);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(o,pw){
  if(!o||o.kind!=='ledger-backup-enc'||o.version!==1||!Number.isInteger(o.iter)||o.iter<1000||o.iter>2e6)throw Error('فایل داده معتبر نیست.');
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb(o.salt),iterations:o.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb(o.iv)},key,unb(o.data)));
  }catch(e){throw Error('رمز اشتباه است یا داده خراب شده است.');}
}
let CFG=null,SNAP=null,started=false,timer=null;
function cfgLoad(){try{return JSON.parse(LS.get('vcfg')||'null');}catch(e){return null;}}
async function fetchEnv(c){
  const r=await fetch('https://api.github.com/repos/'+c.repo+'/contents/snapshot.json?ref='+encodeURIComponent(c.branch||'main'),{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github.raw+json','X-GitHub-Api-Version':'2022-11-28'},cache:'no-store'});
  if(r.status===401)throw Error('توکن نامعتبر است.');
  if(r.status===404)throw Error('مخزن یا فایل پیدا نشد.');
  if(!r.ok)throw Error('خطای GitHub: '+r.status);
  return r.json();
}
async function pull(c){
  const env=await fetchEnv(c);
  const snap=JSON.parse(await decrypt(env,c.pass));
  if(!snap||snap.kind!=='aghsatyar-snapshot')throw Error('قالب داده ناشناخته است.');
  LS.set('vcache',JSON.stringify(env));
  return snap;
}
function showLogin(msg){
  const c=CFG||{};
  document.querySelector('header').hidden=true;$('nav').hidden=true;$('app').hidden=true;
  const el=$('vlogin');el.hidden=false;
  el.innerHTML=`<div class="card"><h2>نسخهٔ نمایشی اقساطیار</h2>${msg?`<p style="color:var(--red)">${esc(msg)}</p>`:''}
  <label>مخزن داده (نام‌کاربری/نام‌مخزن)</label><input id="vrepo" dir="ltr" autocapitalize="off" value="${esc(c.repo||'')}">
  <label>توکن فقط‌خواندنی</label><input id="vtok" type="password" dir="ltr" value="${esc(c.token||'')}">
  <label>رمز رمزنگاری</label><input id="vpass" type="password" value="${esc(c.pass||'')}">
  <p><label><input type="checkbox" id="vrem" checked style="width:auto"> مرا به خاطر بسپار (روی همین دستگاه)</label></p>
  <button id="vgo">ورود</button></div>`;
  $('vgo').onclick=async()=>{
    const n={repo:$('vrepo').value.trim(),token:$('vtok').value.trim(),pass:$('vpass').value,branch:'main'};
    $('vgo').disabled=true;$('vgo').textContent='در حال دریافت…';
    try{const snap=await pull(n);CFG=n;if($('vrem').checked)LS.set('vcfg',JSON.stringify(n));else LS.del('vcfg');await begin(snap);}
    catch(e){showLogin(e.message||'ناموفق بود.');}
  };
}
function strip(){
  let s=$('vstrip');
  if(!s){s=document.createElement('div');s.id='vstrip';document.body.insertBefore(s,document.body.firstChild);}
  const at=SNAP&&SNAP.at?new Date(SNAP.at):null;
  s.innerHTML=`<span>فقط‌خواندنی — آخرین داده: ${at?esc(at.toLocaleString('fa-IR')):'—'}</span><span><button id="vref">به‌روزرسانی</button> <button id="vout" class="plain">خروج</button></span>`;
  $('vref').onclick=()=>refresh(true);
  $('vout').onclick=()=>{LS.del('vcfg');LS.del('vcache');location.reload();};
}
function setNative(){
  const noop=()=>{};
  window.Native={
    load:()=>JSON.stringify(SNAP.data),
    loadLedger:()=>SNAP.ledger?JSON.stringify(SNAP.ledger):'',
    save:()=>false,saveLedger:()=>false,previous:()=>'',previousLedger:()=>'',
    exportFile:(name,text)=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}catch(e){}},
    importFile:noop,
    share:t=>{if(navigator.share)navigator.share({text:t}).catch(noop);else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('کپی شد.'),noop);},
    lock:noop,pin:noop,phone:noop,barColor:noop,
    printPage:()=>window.print()
  };
}
const DENY=/(save|post\(|\bdo\(|trash|purge|restore|reverse|correct|edit|form\(|release|settle|cancel\(|receive|import|reset|backup|bulk|contact\(|sync|delete|remove|lock|pin\(|phone\(|lgnew|add|newcontract|payinst|synpush|setsms|sms)/i;
function hideMut(root){
  (root||document).querySelectorAll('button[onclick]').forEach(b=>{
    const o=b.getAttribute('onclick')||'';
    if((DENY.test(o)&&!/applyRange|setRange|clearRange|showReconcile/.test(o))||/^\s*\+/.test(b.textContent))b.classList.add('vhide');
  });
}
function lock(){
  document.body.classList.add('viewer');
  window.change=()=>{alert('این نسخه فقط‌خواندنی است.');return false;};
  window.changeLedger=window.change;
  if(typeof setTheme==='function'){window.setTheme=t=>{LS.set('vtheme',t);try{db.settings.theme=t;}catch(e){}applyTheme();render();};}
  new MutationObserver(()=>hideMut()).observe(document.body,{childList:true,subtree:true});
  hideMut();
}
function indirect(code){(0,eval)(code);}
async function begin(snap){
  SNAP=snap;setNative();$('vlogin').hidden=true;
  document.querySelector('header').hidden=false;$('nav').hidden=false;$('app').hidden=false;
  if(!started){
    started=true;
    const s=document.createElement('script');s.textContent=$('appsrc').textContent;document.body.appendChild(s);
    lock();
    try{const t=LS.get('vtheme');if(t){db.settings.theme=t;applyTheme();}}catch(e){}
  }else reload();
  strip();
  clearInterval(timer);timer=setInterval(()=>refresh(false),300000);
}
function reload(){
  indirect('db=validateData(JSON.parse(Native.load()));'+
   'try{const _t=Native.loadLedger();if(_t){LG=lValidate(JSON.parse(_t));lMigrate(LG);}}catch(e){}'+
   'render();');
}
async function refresh(manual){
  if(!CFG)return;
  try{const snap=await pull(CFG);SNAP=snap;reload();strip();if(manual)showToast('به‌روز شد ✅');}
  catch(e){if(manual)alert(e.message||'به‌روزرسانی ناموفق بود.');}
}
async function start(){
  CFG=cfgLoad();
  if(!(window.crypto&&crypto.subtle)){showLogin('این مرورگر رمزنگاری را پشتیبانی نمی‌کند (صفحه باید با HTTPS باز شود).');return;}
  if(CFG){
    try{await begin(await pull(CFG));return;}
    catch(e){
      const cached=LS.get('vcache');
      if(cached&&/اتصال|fetch|Failed|network/i.test(e.message+'')||(cached&&e instanceof TypeError)){
        try{await begin(JSON.parse(await decrypt(JSON.parse(cached),CFG.pass)));setTimeout(()=>{const s=$('vstrip');if(s)s.firstChild.textContent+=' (آفلاین)';},0);return;}catch(e2){}
      }
      showLogin(e.message);return;
    }
  }
  showLogin('');
}
start();
})();
</script>
